[package]
name = "duplicate_file_detector"
description = "Detects duplicate files by comparing their content hashes"
version = "0.6.4"
edition = "2021"

[dependencies]
sha2 = "0.10.2"
lla_plugin_sdk = { path = "../../sdk" }
lla_plugin_utils = { path = "../../utils" }
colored = "2.0.0"
prost = "0.12"
bytes = "1.5"
lazy_static = "1.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
tempfile.workspace = true
