[package]
name = "last_git_commit"
description = "A plugin for the lla that provides the last git commit hash"
version = "0.6.3"
edition = "2021"

[dependencies]
colored = "2.0.0"
lla_plugin_sdk = { path = "../../sdk" }
lla_plugin_utils = { path = "../../utils" }
prost = "0.12"
bytes = "1.5"
lazy_static = "1.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
tempfile.workspace = true
