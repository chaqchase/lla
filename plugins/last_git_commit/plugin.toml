schema_version = 3

[plugin]
id = "dev.lla.last-git-commit"
name = "last_git_commit"
version = "0.6.2"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "last_git_commit"
description = "Expose the last Git commit for each entry"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:tree"]
process = true

[[fields]]
name = "commit_hash"
type = "string"
filterable = true

[[fields]]
name = "commit_author"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "commit_time"
type = "timestamp"
sortable = true
filterable = true

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run last_git_commit help"]
interactive = true
arguments = []
output = { type = "none" }
