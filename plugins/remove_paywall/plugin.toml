schema_version = 3

[plugin]
id = "dev.lla.remove-paywall"
name = "remove_paywall"
version = "0.6.2"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "remove_paywall"
description = "Create archival and reader links for URLs"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["archive.is", "12ft.io", "removepaywall.com", "freedium.cfd", "webcache.googleusercontent.com"]
clipboard = true
open_url = true

[[actions]]
id = "remove"
description = "Remove paywall from URL"
examples = ["lla plugin run remove_paywall remove -- https://example.com"]
interactive = true
arguments = [{ name = "url", type = "string", description = "Article URL.", position = 0 }]
output = { type = "none" }

[[actions]]
id = "clipboard"
description = "Remove paywall from clipboard URL"
examples = ["lla plugin run remove_paywall clipboard"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "choose"
description = "Choose service interactively"
examples = ["lla plugin run remove_paywall choose"]
interactive = true
arguments = [{ name = "url", type = "string", description = "Article URL.", position = 0 }]
output = { type = "none" }

