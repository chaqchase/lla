schema_version = 3

[plugin]
id = "dev.lla.remove-paywall"
name = "remove_paywall"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "remove_paywall"
description = "Create archival and reader links for URLs"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["archive.is", "12ft.io", "removepaywall.com", "freedium.cfd", "webcache.googleusercontent.com"]
clipboard = true
open_url = true

[[actions]]
id = "remove"
description = "Run the remove action"
examples = ["lla plugin run remove_paywall remove"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

