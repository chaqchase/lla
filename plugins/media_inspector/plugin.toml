schema_version = 3

[plugin]
id = "dev.lla.media-inspector"
name = "media_inspector"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "media_inspector"
description = "Inspect MIME, dimensions, EXIF, duration, codecs, and bitrate"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["read:selection", "read:user-path"]
process = true

[[fields]]
name = "mime_type"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "media_kind"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "media_width"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "media_height"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "duration_ms"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "codecs"
type = "string"
filterable = true

[[fields]]
name = "bitrate_bps"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "exif"
type = "string"
filterable = true

[[actions]]
id = "inspect"
description = "Run the inspect action"
examples = ["lla plugin run media_inspector inspect"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "tools"
description = "Run the tools action"
examples = ["lla plugin run media_inspector tools"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run media_inspector help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
