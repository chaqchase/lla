[package]
name = "media_inspector"
version = "0.6.1"
edition = "2021"
description = "Inspect MIME types, image metadata, and audio/video stream details"

[lib]
crate-type = ["cdylib"]

[dependencies]
lla_plugin_sdk = { path = "../../sdk" }
lla_plugin_utils = { path = "../../utils" }
lazy_static = "1.4"
parking_lot = "0.12"
rayon.workspace = true
serde.workspace = true
serde_json = "1.0"
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3.2"
