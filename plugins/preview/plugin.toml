schema_version = 3

[plugin]
id = "dev.lla.preview"
name = "preview"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "preview"
description = "Preview source text, Markdown, images, and archives in the terminal"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["read:selection", "read:user-path"]
process = true

[[fields]]
name = "preview_kind"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "preview_backend"
type = "string"
filterable = true

[[actions]]
id = "show"
description = "Run the show action"
examples = ["lla plugin run preview show"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "backends"
description = "Run the backends action"
examples = ["lla plugin run preview backends"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run preview help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
