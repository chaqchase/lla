schema_version = 3

[plugin]
id = "dev.lla.google-search"
name = "google_search"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "google_search"
description = "Search Google with suggestions and history"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["google.com", "suggestqueries.google.com"]
clipboard = true
open_url = true

[[actions]]
id = "search"
description = "Run the search action"
examples = ["lla plugin run google_search search"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "search-selected"
description = "Run the search-selected action"
examples = ["lla plugin run google_search search-selected"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "history"
description = "Run the history action"
examples = ["lla plugin run google_search history"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Run the preferences action"
examples = ["lla plugin run google_search preferences"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run google_search help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
