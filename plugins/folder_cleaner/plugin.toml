schema_version = 3

[plugin]
id = "dev.lla.folder-cleaner"
name = "folder_cleaner"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "folder_cleaner"
description = "Plan, quarantine and restore generated-folder cleanup"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
filesystem = ["read:tree", "write:tree", "delete:quarantine"]

[[actions]]
id = "scan"
description = "Run the scan action"
examples = ["lla plugin run folder_cleaner scan"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

