schema_version = 3

[plugin]
id = "dev.lla.code-complexity"
name = "code_complexity"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "code_complexity"
description = "Analyze source-code complexity"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["read:selection"]

[[fields]]
name = "complexity_metrics"
type = "string"
filterable = true

[[actions]]
id = "set-thresholds"
description = "Run the set-thresholds action"
examples = ["lla plugin run code_complexity set-thresholds"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "show-report"
description = "Run the show-report action"
examples = ["lla plugin run code_complexity show-report"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run code_complexity help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
