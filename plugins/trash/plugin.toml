schema_version = 3

[plugin]
id = "dev.lla.trash"
name = "trash"
version = "0.6.4"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "trash"
description = "Cross-platform recoverable deletion with restore support"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:selection", "read:user-path", "write:user-path", "delete:selection", "delete:quarantine"]

[[fields]]
name = "trashable"
type = "boolean"
filterable = true

[[fields]]
name = "trash_state"
type = "string"
filterable = true

[[actions]]
id = "put"
description = "Move one or more files or directories into recoverable trash"
examples = ["lla plugin run trash put -- ./draft.txt ./old-folder"]
interactive = true
arguments = [{ name = "paths", type = "path", description = "One or more file or directory paths.", position = 0, required = true, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "list"
description = "List recoverable trash records and their original paths"
examples = ["lla plugin run trash list"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "restore"
description = "Restore a trashed item without overwriting an existing path"
examples = ["lla plugin run trash restore -- 20260815T120000.000Z-123-0"]
interactive = true
arguments = [{ name = "id", type = "string", description = "Identifier of the item to process.", position = 0, required = true }]
output = { type = "none" }

[[actions]]
id = "empty"
description = "Permanently delete old trash records after explicit confirmation"
examples = ["lla plugin run trash empty -- 30 -- --yes"]
interactive = true
arguments = [{ name = "older_than_days", type = "integer", description = "Only include records older than this many days.", position = 0, min = 0 }, { name = "yes", type = "boolean", description = "Confirm the irreversible operation.", option = "--yes", required = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Show recoverable trash usage"
examples = ["lla plugin run trash help"]
interactive = true
arguments = []
output = { type = "none" }
