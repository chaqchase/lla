schema_version = 3

[plugin]
id = "dev.lla.brew"
name = "brew"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "brew"
description = "Manage Homebrew packages"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["formulae.brew.sh", "github.com"]
process = true

[[actions]]
id = "list"
description = "Run the list action"
examples = ["lla plugin run brew list"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "search"
description = "Run the search action"
examples = ["lla plugin run brew search"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
