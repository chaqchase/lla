schema_version = 3

[plugin]
id = "dev.lla.project-context"
name = "project_context"
version = "0.6.2"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "project_context"
description = "Detect project type, toolchains, dependency locks, artifacts, and repository health"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:tree", "read:tree", "read:user-path"]
process = true

[[fields]]
name = "project_type"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "project_root"
type = "path"
filterable = true

[[fields]]
name = "project_health"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "project_issues"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "lockfile_state"
type = "string"
filterable = true

[[fields]]
name = "build_artifacts"
type = "string"
filterable = true

[[fields]]
name = "toolchains"
type = "string"
filterable = true

[[fields]]
name = "repository_state"
type = "string"
filterable = true

[[fields]]
name = "git_branch"
type = "string"
filterable = true

[[actions]]
id = "inspect"
description = "Inspect the nearest project and print ecosystem and repository health"
examples = ["lla plugin run project_context inspect -- ."]
interactive = true
arguments = [{ name = "path", type = "path", description = "Path to the file or directory.", position = 0, required = true }]
output = { type = "none" }

[[actions]]
id = "refresh"
description = "Clear cached project detection results"
examples = ["lla plugin run project_context refresh"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show project context usage"
examples = ["lla plugin run project_context help"]
interactive = true
arguments = []
output = { type = "none" }
