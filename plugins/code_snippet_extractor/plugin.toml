schema_version = 3

[plugin]
id = "dev.lla.code-snippet-extractor"
name = "code_snippet_extractor"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "code_snippet_extractor"
description = "Extract and manage tagged code snippets"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["read:selection", "read:user-path", "write:user-path"]
clipboard = true

[[fields]]
name = "snippet_count"
type = "integer"
sortable = true
filterable = true

[[actions]]
id = "extract"
description = "Run the extract action"
examples = ["lla plugin run code_snippet_extractor extract"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "list"
description = "Run the list action"
examples = ["lla plugin run code_snippet_extractor list"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
