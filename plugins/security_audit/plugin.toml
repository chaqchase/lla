[plugin]
id = "dev.lla.security-audit"
name = "security_audit"
version = "0.5.12"
api_min = 2
api_max = 2
runtime = "native"
entrypoint = "security_audit"
description = "Audit unsafe permissions, privileged bits, risky symlinks, and exposed secrets"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
actions = ["audit", "help"]
machine_output = true

[permissions]
filesystem = ["metadata:tree"]

[[fields]]
name = "security_risk"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "security_score"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "security_findings"
type = "string"
filterable = true

[[fields]]
name = "suspicious_symlink"
type = "boolean"
filterable = true

[[fields]]
name = "secret_exposed"
type = "boolean"
filterable = true
