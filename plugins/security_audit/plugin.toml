schema_version = 3

[plugin]
id = "dev.lla.security-audit"
name = "security_audit"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "security_audit"
description = "Audit unsafe permissions, privileged bits, risky symlinks, and exposed secrets"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:tree"]

[[fields]]
name = "security_risk"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "security_score"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "security_findings"
type = "string"
filterable = true

[[fields]]
name = "suspicious_symlink"
type = "boolean"
filterable = true

[[fields]]
name = "secret_exposed"
type = "boolean"
filterable = true

[[actions]]
id = "audit"
description = "Run the audit action"
examples = ["lla plugin run security_audit audit"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run security_audit help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
