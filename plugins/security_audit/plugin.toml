schema_version = 3

[plugin]
id = "dev.lla.security-audit"
name = "security_audit"
version = "0.6.1"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "security_audit"
description = "Audit unsafe permissions, privileged bits, risky symlinks, and exposed secrets"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:tree"]

[[fields]]
name = "security_risk"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "security_score"
type = "integer"
sortable = true
filterable = true

[[fields]]
name = "security_findings"
type = "string"
filterable = true

[[fields]]
name = "suspicious_symlink"
type = "boolean"
filterable = true

[[fields]]
name = "secret_exposed"
type = "boolean"
filterable = true

[[actions]]
id = "audit"
description = "Audit a file or directory and print security findings"
examples = ["lla plugin run security_audit audit -- .", "lla plugin run security_audit audit -- . -- --recursive"]
interactive = true
arguments = [{ name = "path", type = "path", description = "Path to the file or directory.", position = 0, required = true }, { name = "recursive", type = "boolean", description = "Process nested directories recursively.", option = "--recursive" }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Show security audit usage and risk rules"
examples = ["lla plugin run security_audit help"]
interactive = true
arguments = []
output = { type = "none" }
