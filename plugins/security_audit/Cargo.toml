[package]
name = "security_audit"
version = "0.6.0"
edition = "2021"
description = "Audit filesystem entries for unsafe permissions, risky links, and exposed secrets"

[lib]
crate-type = ["cdylib"]

[dependencies]
lla_plugin_sdk = { path = "../../lla_plugin_sdk" }
lla_plugin_utils = { path = "../../lla_plugin_utils" }
lazy_static = "1.4"
parking_lot = "0.12"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.2"
