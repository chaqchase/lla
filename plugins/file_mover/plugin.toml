schema_version = 3

[plugin]
id = "dev.lla.file-mover"
name = "file_mover"
version = "0.6.4"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "file_mover"
description = "Interactively move files and directories"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
filesystem = ["read:tree", "write:selected-destination", "delete:selection"]
clipboard = true

[[actions]]
id = "add"
description = "Add files/directories to clipboard from current or specified directory"
examples = ["lla plugin run file_mover add", "lla plugin run file_mover add -- /path/to/dir"]
interactive = true
arguments = [{ name = "path", type = "path", description = "Path to the file or directory.", position = 0 }]
output = { type = "none" }

[[actions]]
id = "move-all"
description = "Move all items from clipboard to current or specified directory"
examples = ["lla plugin run file_mover move-all", "lla plugin run file_mover move-all -- /path/to/target"]
interactive = true
arguments = [{ name = "target_path", type = "path", description = "Destination path.", position = 0 }]
output = { type = "none" }

[[actions]]
id = "move-partial"
description = "Move selected items from clipboard to current or specified directory"
examples = ["lla plugin run file_mover move-partial", "lla plugin run file_mover move-partial -- /path/to/target"]
interactive = true
arguments = [{ name = "target_path", type = "path", description = "Destination path.", position = 0 }]
output = { type = "none" }

[[actions]]
id = "clear"
description = "Clear the clipboard"
examples = ["lla plugin run file_mover clear"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "show"
description = "Show clipboard contents"
examples = ["lla plugin run file_mover show"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run file_mover help"]
interactive = true
arguments = []
output = { type = "none" }
