schema_version = 3

[plugin]
id = "dev.lla.file-mover"
name = "file_mover"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "file_mover"
description = "Interactively move files and directories"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
filesystem = ["read:tree", "write:selected-destination", "delete:selection"]
clipboard = true

[[actions]]
id = "add"
description = "Run the add action"
examples = ["lla plugin run file_mover add"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "move-all"
description = "Run the move-all action"
examples = ["lla plugin run file_mover move-all"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "move-partial"
description = "Run the move-partial action"
examples = ["lla plugin run file_mover move-partial"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "clear"
description = "Run the clear action"
examples = ["lla plugin run file_mover clear"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "show"
description = "Run the show action"
examples = ["lla plugin run file_mover show"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run file_mover help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
