schema_version = 3

[plugin]
id = "dev.lla.keyword-search"
name = "keyword_search"
version = "0.6.3"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "keyword_search"
description = "Search selected file contents for keywords"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["read:selection", "write:user-path"]
clipboard = true

[[fields]]
name = "keyword_matches"
type = "string"
filterable = true

[[actions]]
id = "search"
description = "Search for keywords in files"
examples = ["lla plugin run keyword_search search"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run keyword_search help"]
interactive = true
arguments = []
output = { type = "none" }
