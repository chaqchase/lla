schema_version = 3

[plugin]
id = "dev.lla.youtube"
name = "youtube"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "youtube"
description = "Search and open YouTube videos"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["youtube.com", "suggestqueries.google.com"]
clipboard = true
open_url = true

[[actions]]
id = "search"
description = "Run the search action"
examples = ["lla plugin run youtube search"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "search-selected"
description = "Run the search-selected action"
examples = ["lla plugin run youtube search-selected"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "history"
description = "Run the history action"
examples = ["lla plugin run youtube history"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Run the preferences action"
examples = ["lla plugin run youtube preferences"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run youtube help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
