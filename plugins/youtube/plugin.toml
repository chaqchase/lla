schema_version = 3

[plugin]
id = "dev.lla.youtube"
name = "youtube"
version = "0.6.4"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "youtube"
description = "Search and open YouTube videos"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["youtube.com", "suggestqueries.google.com"]
clipboard = true
open_url = true

[[actions]]
id = "search"
description = "Search YouTube videos"
examples = ["lla plugin run youtube search"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "search-selected"
description = "Search selected text on YouTube"
examples = ["lla plugin run youtube search-selected"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "history"
description = "Manage search history"
examples = ["lla plugin run youtube history"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Configure preferences"
examples = ["lla plugin run youtube preferences"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run youtube help"]
interactive = true
arguments = []
output = { type = "none" }
