schema_version = 3

[plugin]
id = "dev.lla.file-copier"
name = "file_copier"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "file_copier"
description = "Interactively copy files and directories"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
filesystem = ["read:tree", "write:selected-destination"]
clipboard = true

[[actions]]
id = "add"
description = "Run the add action"
examples = ["lla plugin run file_copier add"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "copy-all"
description = "Run the copy-all action"
examples = ["lla plugin run file_copier copy-all"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "copy-partial"
description = "Run the copy-partial action"
examples = ["lla plugin run file_copier copy-partial"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "clear"
