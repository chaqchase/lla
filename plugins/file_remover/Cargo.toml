[package]
name = "file_remover"
version = "0.6.2"
edition = "2021"
description = "Interactively trash files by default with explicit permanent deletion"

[lib]
crate-type = ["cdylib"]

[dependencies]
lla_plugin_sdk = { path = "../../sdk" }
lla_plugin_utils = { path = "../../utils" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11"
colored = "2.0"
lazy_static = "1.4"
parking_lot = "0.12"
