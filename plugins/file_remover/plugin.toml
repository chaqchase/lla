schema_version = 3

[plugin]
id = "dev.lla.file-remover"
name = "file_remover"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "file_remover"
description = "Interactively trash files by default with explicit permanent deletion"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
filesystem = ["read:tree", "write:user-path", "delete:selection", "delete:quarantine"]

[[actions]]
id = "remove"
description = "Run the remove action"
examples = ["lla plugin run file_remover remove"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "purge"
description = "Run the purge action"
examples = ["lla plugin run file_remover purge"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run file_remover help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
