[plugin]
id = "dev.lla.file-remover"
name = "file_remover"
version = "0.5.12"
api_min = 2
api_max = 2
runtime = "native"
entrypoint = "file_remover"
description = "Interactively remove files and directories"
license = "MIT"

[capabilities]
formats = ["default"]
actions = ["remove", "help"]

[permissions]
filesystem = ["read:tree", "delete:selection"]
