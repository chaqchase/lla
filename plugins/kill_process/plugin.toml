schema_version = 3

[plugin]
id = "dev.lla.kill-process"
name = "kill_process"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "kill_process"
description = "Inspect and terminate operating-system processes"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
process = true

[[actions]]
id = "list"
description = "Run the list action"
examples = ["lla plugin run kill_process list"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "kill"
description = "Run the kill action"
examples = ["lla plugin run kill_process kill"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

