schema_version = 3

[plugin]
id = "dev.lla.categorizer"
name = "categorizer"
version = "0.6.1"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "categorizer"
description = "Categorize files from extensions and metadata"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:selection"]

[[fields]]
name = "category"
type = "string"
sortable = true
filterable = true

[[fields]]
name = "subcategory"
type = "string"
sortable = true
filterable = true

[[actions]]
id = "add-category"
description = "Add a new category"
examples = ["lla plugin run categorizer add-category -- Documents blue txt,doc,pdf \"Text documents\""]
interactive = true
arguments = [{ name = "name", type = "string", description = "Name of the item to create or select.", position = 0, required = true }, { name = "color", type = "string", description = "Display color for the category.", position = 1, required = true }, { name = "extensions", type = "string", description = "Comma-separated file extensions.", position = 2, required = true }, { name = "description", type = "string", description = "Human-readable description.", position = 3 }]
output = { type = "none" }

[[actions]]
id = "add-subcategory"
description = "Add a subcategory to an existing category"
examples = ["lla plugin run categorizer add-subcategory -- Documents Text txt,md"]
interactive = true
arguments = [{ name = "category", type = "string", description = "Category name to use.", position = 0, required = true }, { name = "subcategory", type = "string", description = "Subcategory name.", position = 1, required = true }, { name = "extensions", type = "string", description = "Comma-separated file extensions.", position = 2, required = true }]
output = { type = "none" }

[[actions]]
id = "list-categories"
description = "List all categories and their details"
examples = ["lla plugin run categorizer list-categories"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run categorizer help"]
interactive = true
arguments = []
output = { type = "none" }
