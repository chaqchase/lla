schema_version = 3

[plugin]
id = "dev.lla.google-meet"
name = "google_meet"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "google_meet"
description = "Create and manage Google Meet links"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["meet.google.com"]
clipboard = true
open_url = true

[[actions]]
id = "create"
description = "Create a Google Meet"
examples = ["lla plugin run google_meet create"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "create-with-profile"
description = "Create a Meet with profile selection"
examples = ["lla plugin run google_meet create-with-profile"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "history"
description = "Manage Meet history"
examples = ["lla plugin run google_meet history"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "profiles"
description = "Manage profiles"
examples = ["lla plugin run google_meet profiles"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Configure preferences"
examples = ["lla plugin run google_meet preferences"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run google_meet help"]
interactive = true
arguments = []
output = { type = "none" }
