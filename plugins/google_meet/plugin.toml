schema_version = 3

[plugin]
id = "dev.lla.google-meet"
name = "google_meet"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "google_meet"
description = "Create and manage Google Meet links"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["meet.google.com"]
clipboard = true
open_url = true

[[actions]]
id = "create"
description = "Run the create action"
examples = ["lla plugin run google_meet create"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "create-with-profile"
description = "Run the create-with-profile action"
examples = ["lla plugin run google_meet create-with-profile"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "history"
