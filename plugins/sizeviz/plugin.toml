schema_version = 3

[plugin]
id = "dev.lla.sizeviz"
name = "sizeviz"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "sizeviz"
description = "Visualize file sizes"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:selection"]

[[fields]]
name = "size"
type = "bytes"
sortable = true
filterable = true

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run sizeviz help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
