schema_version = 3

[plugin]
id = "dev.lla.file-tagger"
name = "file_tagger"
version = "0.6.4"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "file_tagger"
description = "Attach and query user-defined file tags"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["metadata:selection"]

[[fields]]
name = "tags"
type = "string"
filterable = true

[[actions]]
id = "add-tag"
description = "Add a tag to a file"
examples = ["lla plugin run file_tagger add-tag -- \"/path/to/file\" \"mytag\""]
interactive = true
arguments = [{ name = "file_path", type = "path", description = "Path to the source file.", position = 0, required = true }, { name = "tag", type = "string", description = "Tag to find or modify.", position = 1, required = true }]
output = { type = "none" }

[[actions]]
id = "remove-tag"
description = "Remove a tag from a file"
examples = ["lla plugin run file_tagger remove-tag -- \"/path/to/file\" \"mytag\""]
interactive = true
arguments = [{ name = "file_path", type = "path", description = "Path to the source file.", position = 0, required = true }, { name = "tag", type = "string", description = "Tag to find or modify.", position = 1, required = true }]
output = { type = "none" }

[[actions]]
id = "list-tags"
description = "List all tags for a file"
examples = ["lla plugin run file_tagger list-tags -- \"/path/to/file\""]
interactive = true
arguments = [{ name = "file_path", type = "path", description = "Path to the source file.", position = 0, required = true }]
output = { type = "none" }

[[actions]]
id = "all-tags"
description = "List all registered tags"
examples = ["lla plugin run file_tagger all-tags"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "files-by-tag"
description = "List all files tagged with the given tag"
examples = ["lla plugin run file_tagger files-by-tag -- \"tag-to-query\""]
interactive = true
arguments = [{ name = "tag", type = "string", description = "Tag to find or modify.", position = 0, required = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run file_tagger help"]
interactive = true
arguments = []
output = { type = "none" }
