schema_version = 3

[plugin]
id = "dev.lla.file-hash"
name = "file_hash"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "file_hash"
description = "Calculate file hashes"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
machine_output = true

[permissions]
filesystem = ["read:selection"]

[[fields]]
name = "sha1"
type = "string"
filterable = true

[[fields]]
name = "sha256"
type = "string"
filterable = true

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run file_hash help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
