[plugin]
id = "dev.lla.file-hash"
name = "file_hash"
version = "0.5.12"
api_min = 2
api_max = 2
runtime = "native"
entrypoint = "file_hash"
description = "Calculate file hashes"
license = "MIT"

[capabilities]
decorates_entries = true
formats = ["default", "long"]
actions = ["help"]
machine_output = true

[permissions]
filesystem = ["read:selection"]

[[fields]]
name = "sha1"
type = "string"
filterable = true

[[fields]]
name = "sha256"
type = "string"
filterable = true
