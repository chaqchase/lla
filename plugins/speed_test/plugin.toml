schema_version = 3

[plugin]
id = "dev.lla.speed-test"
name = "speed_test"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "speed_test"
description = "Measure network latency and throughput"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["cloudflare-dns.com", "dns.google", "nbg1-speed.hetzner.com", "proof.ovh.net", "speed.cloudflare.com", "welcome.opendns.com"]

[[actions]]
id = "test"
description = "Run the test action"
examples = ["lla plugin run speed_test test"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "quick"
description = "Run the quick action"
examples = ["lla plugin run speed_test quick"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "history"
description = "Run the history action"
examples = ["lla plugin run speed_test history"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "clear-history"
description = "Run the clear-history action"
examples = ["lla plugin run speed_test clear-history"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "menu"
description = "Run the menu action"
examples = ["lla plugin run speed_test menu"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run speed_test help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
