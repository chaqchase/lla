schema_version = 3

[plugin]
id = "dev.lla.flush-dns"
name = "flush_dns"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "flush_dns"
description = "Flush the operating system DNS cache"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
process = true

[[actions]]
id = "flush"
description = "Run the flush action"
examples = ["lla plugin run flush_dns flush"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "history"
description = "Run the history action"
examples = ["lla plugin run flush_dns history"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "clear-history"
description = "Run the clear-history action"
examples = ["lla plugin run flush_dns clear-history"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Run the preferences action"
examples = ["lla plugin run flush_dns preferences"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run flush_dns help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
