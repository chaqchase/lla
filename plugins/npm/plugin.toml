schema_version = 3

[plugin]
id = "dev.lla.npm"
name = "npm"
version = "0.6.2"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "npm"
description = "Search npm packages and inspect bundle size"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["registry.npmjs.org", "bundlephobia.com"]
clipboard = true
open_url = true

[[actions]]
id = "search"
description = "Search npm packages"
examples = ["lla plugin run npm search"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "favorites"
description = "View favorite packages"
examples = ["lla plugin run npm favorites"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Configure preferences"
examples = ["lla plugin run npm preferences"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run npm help"]
interactive = true
arguments = []
output = { type = "none" }
