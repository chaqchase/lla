schema_version = 3

[plugin]
id = "dev.lla.npm"
name = "npm"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "npm"
description = "Search npm packages and inspect bundle size"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["registry.npmjs.org", "bundlephobia.com"]
clipboard = true
open_url = true

[[actions]]
id = "search"
description = "Run the search action"
examples = ["lla plugin run npm search"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "favorites"
description = "Run the favorites action"
examples = ["lla plugin run npm favorites"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "preferences"
description = "Run the preferences action"
examples = ["lla plugin run npm preferences"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "help"
description = "Run the help action"
examples = ["lla plugin run npm help"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }
