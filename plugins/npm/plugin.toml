[plugin]
id = "dev.lla.npm"
name = "npm"
version = "0.5.12"
api_min = 2
api_max = 2
runtime = "native"
entrypoint = "npm"
description = "Search npm packages and inspect bundle size"
license = "MIT"

[capabilities]
formats = ["default"]
actions = ["search", "favorites", "preferences", "help"]

[permissions]
network = ["registry.npmjs.org", "bundlephobia.com"]
clipboard = true
open_url = true
