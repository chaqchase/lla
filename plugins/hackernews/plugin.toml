schema_version = 3

[plugin]
id = "dev.lla.hackernews"
name = "hackernews"
version = "0.6.4"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "hackernews"
description = "Browse Hacker News stories and discussions"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["hacker-news.firebaseio.com", "news.ycombinator.com"]
clipboard = true
open_url = true

[[actions]]
id = "top"
description = "Show top stories"
examples = ["lla plugin run hackernews top"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "best"
description = "Show best stories"
examples = ["lla plugin run hackernews best"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "new"
description = "Show new stories"
examples = ["lla plugin run hackernews new"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "newest"
description = "Show new stories (alias for new)"
examples = ["lla plugin run hackernews newest"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "ask"
description = "Show Ask HN"
examples = ["lla plugin run hackernews ask"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "show"
description = "Show Show HN"
examples = ["lla plugin run hackernews show"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "jobs"
description = "Show job postings"
examples = ["lla plugin run hackernews jobs"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "open"
description = "Open story in browser"
examples = ["lla plugin run hackernews open -- 1"]
interactive = true
arguments = [{ name = "number", type = "integer", description = "One-based item number.", position = 0, required = true, min = 1 }]
output = { type = "none" }

[[actions]]
id = "comments"
description = "Open story comments"
examples = ["lla plugin run hackernews comments -- 1"]
interactive = true
arguments = [{ name = "number", type = "integer", description = "One-based item number.", position = 0, required = true, min = 1 }]
output = { type = "none" }

[[actions]]
id = "copy"
description = "Copy story URL"
examples = ["lla plugin run hackernews copy -- 1"]
interactive = true
arguments = [{ name = "number", type = "integer", description = "One-based item number.", position = 0, required = true, min = 1 }]
output = { type = "none" }

[[actions]]
id = "browse"
description = "Interactive browser"
examples = ["lla plugin run hackernews browse"]
interactive = true
arguments = [{ name = "topic", type = "string", description = "Story topic to browse.", position = 0, choices = ["top", "best", "new", "newest", "ask", "show", "jobs"] }]
output = { type = "none" }

[[actions]]
id = "menu"
description = "Interactive menu"
examples = ["lla plugin run hackernews menu"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "clear-cache"
description = "Clear cached Hacker News stories"
examples = ["lla plugin run hackernews clear-cache"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "refresh"
description = "Clear cached stories (alias for clear-cache)"
examples = ["lla plugin run hackernews refresh"]
interactive = true
arguments = []
output = { type = "none" }

[[actions]]
id = "help"
description = "Show help information"
examples = ["lla plugin run hackernews help"]
interactive = true
arguments = []
output = { type = "none" }
