schema_version = 3

[plugin]
id = "dev.lla.hackernews"
name = "hackernews"
version = "0.6.0"
api_min = 3
api_max = 3
runtime = "native"
entrypoint = "hackernews"
description = "Browse Hacker News stories and discussions"
license = "MIT"

[capabilities]
formats = ["default"]

[permissions]
network = ["hacker-news.firebaseio.com", "news.ycombinator.com"]
clipboard = true
open_url = true

[[actions]]
id = "top"
description = "Run the top action"
examples = ["lla plugin run hackernews top"]
interactive = true
arguments = [{ name = "args", type = "string", position = 0, repeatable = true }]
output = { type = "none" }

[[actions]]
id = "best"
description = "Run the best action"
examples = ["lla plugin run hackernews best"]
