[package]
name = "lla_plugin_sdk"
description = "High-level SDK for lla API v3 plugins"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sdk"
keywords = ["cli", "plugin", "sdk"]
